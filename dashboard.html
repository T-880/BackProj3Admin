<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <header>
        <h1>Dashboard</h1>
        <button id="logoutBtn">Logga ut</button>
    </header>

    <section class="create-section">
        <h2>Lägg till pizza</h2>

        <form id="createForm">
            <input type="text" id="title" placeholder="Titel" required />
            <input type="text" id="description" placeholder="Beskrivning" required />
            <input type="number" id="price" placeholder="Pris" required />

            <button type="submit">Lägg till</button>
        </form>
    </section>

    <main>
        <h2>Meny</h2>
        <div id="menuList"></div>
    </main>

    <script src="auth.js"></script>
    <script src="dashboard.js"></script>

    <script>
        document.getElementById("logoutBtn").addEventListener("click", logout);
    </script>

</body>

</html>
