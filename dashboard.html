<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forno Nero | Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <!-- Header med titel och utloggningsknapp -->
    <header class="dashboard-header">

        <h1>Forno Nero Admin</h1>

        <button id="logoutBtn" class="logout-btn">
            Logga ut
        </button>

    </header>

    <!-- Sektion för att skapa nya användare -->
    <section id="userSection" class="create-section">

        <h2>Skapa ny användare</h2>

        <form id="createUserForm" class="create-form">

            <!-- Rollval för användaren -->
            <select id="role">
                <option value="admin">Admin</option>
                <option value="chef">Chef</option>
            </select>

            <input type="text" id="username" placeholder="Användarnamn" required>
            <input type="password" id="password" placeholder="Lösenord" required>
            <input type="password" id="confirmPassword" placeholder="Bekräfta lösenord" required>
            <input type="text" id="fullName" placeholder="Fullständigt namn" required>
            <input type="text" id="phone" placeholder="Telefonnummer" required>

            <button type="submit">Skapa användare</button>

        </form>

        <!-- Lista över befintliga användare -->
        <div id="usersList"></div>

    </section>

    <!-- Sektion för att skapa nya menyartiklar -->
    <section class="create-section">

        <h2>Lägg till en ny artikel på menyn</h2>

        <form id="createForm" class="create-form">

            <!-- Kategorival för menyobjekt -->
            <select id="category" required>
                <option value="" selected disabled>Välj kategori</option>
                <option value="pizza">Pizza</option>
                <option value="drink">Dryck</option>
            </select>

            <input type="text" id="title" placeholder="Namn" required>
            <input type="text" id="description" placeholder="Beskrivning" required>
            <input type="number" id="price" placeholder="Pris" required>
            <input type="text" id="imageUrl" placeholder="Bild">

            <button type="submit">Lägg till</button>

        </form>

    </section>

    <!-- Huvudinnehåll: visar aktuell meny -->
    <main class="dashboard-main">

        <h2>Aktuell meny</h2>

        <h2>Pizzor</h2>
        <div id="pizzaList" class="menu-grid"></div>

        <h2>Drycker</h2>
        <div id="drinkList" class="menu-grid"></div>

    </main>

    <!-- JavaScript för autentisering och dashboardlogik -->
    <script src="auth.js"></script>
    <script src="dashboard.js"></script>

    <!-- Logout-funktion kopplad till knapp -->
    <script>
        document.getElementById("logoutBtn").addEventListener("click", logout);
    </script>

</body>

</html>
