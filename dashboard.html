<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forno Nero | Admin Dashboard</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body class="dashboard-body">

    <header class="dashboard-header">

        <h1>Forno Nero Admin</h1>

        <button id="logoutBtn" class="logout-btn">
            Logga ut
        </button>

    </header>

    <section id="userSection" class="create-section">

        <h2>Skapa ny användare</h2>

        <form id="createUserForm" class="create-form">

            <input type="text" id="username" placeholder="Användarnamn" required />
            <input type="password" id="password" placeholder="Lösenord" required />
            <input type="password" id="confirmPassword" placeholder="Bekräfta lösenord" required />

            <select id="role">
                <option value="admin">Admin</option>
                <option value="chef">Chef</option>
            </select>

            <button type="submit">Skapa användare</button>

        </form>

    </section>

    <section class="create-section">

        <h2>Lägg till en ny pizza på menyn</h2>

        <form id="createForm" class="create-form">

            <input type="text" id="title" placeholder="Namn på pizza" required />
            <input type="text" id="description" placeholder="Innehåll på pizzan (sås och ost först)" required />
            <input type="number" id="price" placeholder="Pris" required />

            <button type="submit">Lägg till pizza</button>

        </form>

    </section>

    <main class="dashboard-main">

        <h2>Aktuell meny</h2>

        <div id="menuList" class="menu-grid"></div>

    </main>

    <script src="auth.js"></script>
    <script src="dashboard.js"></script>

    <script>
        document.getElementById("logoutBtn").addEventListener("click", logout);
    </script>

</body>

</html>
